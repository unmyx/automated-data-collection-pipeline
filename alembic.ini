# Alembic configuration for the `alembic` command line.
#
# `adcp db upgrade|current` drive the same migrations programmatically through
# src/adcp/db/migrations/runner.py, so this file exists for developers who prefer
# the upstream CLI (and for `alembic check` in CI).
#
# Leave `sqlalchemy.url` empty: env.py resolves the DSN from ADCP settings
# (ADCP_DATABASE_URL / DATABASE_URL / .env), so the migration always runs against
# the same database as the application and no credentials live in this file.

[alembic]
script_location = src/adcp/db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
