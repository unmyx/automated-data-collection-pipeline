name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # Proves the unit suite needs nothing but Python: no database, no services,
    # no network. If a unit test ever grows an external dependency, this job fails.
    name: Unit tests (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the package with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . --group dev

      - name: Unit tests
        run: pytest -m "not integration" -q

  quality:
    name: Quality gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: adcp
          POSTGRES_PASSWORD: adcp_ci_password
          POSTGRES_DB: adcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adcp -d adcp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # A disposable database: the suite truncates tables between tests.
      ADCP_TEST_DATABASE_URL: postgresql+psycopg://adcp:adcp_ci_password@localhost:5432/adcp_test
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor, 3.13 is the container's interpreter, 3.14 is what the
        # project is developed on. Nothing else is advertised.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . --group dev

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Byte-compile every module
        run: python -m compileall -q src tests scripts

      - name: Validate the Compose file
        run: docker compose config -q

      - name: Apply migrations to an empty database
        env:
          ADCP_DATABASE_URL: postgresql+psycopg://adcp:adcp_ci_password@localhost:5432/adcp_test
        run: |
          python -m adcp db upgrade
          python -m adcp db current --check

      - name: Detect schema drift between the models and the migrations
        env:
          ADCP_DATABASE_URL: postgresql+psycopg://adcp:adcp_ci_password@localhost:5432/adcp_test
        run: python -m alembic check

      - name: Verify the documentation samples are up to date
        # Regenerates docs/samples into a scratch database and fails when the
        # committed output no longer matches the code (docs/PLAN.md section 18).
        env:
          ADCP_DATABASE_URL: postgresql+psycopg://adcp:adcp_ci_password@localhost:5432/adcp_test
        run: python scripts/capture_samples.py --check

      - name: Test with coverage (unit + PostgreSQL integration, threshold enforced)
        run: pytest --cov --cov-report=term-missing

  container:
    name: Container image builds and the CLI runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag adcp:ci .

      - name: Run the installed console script as the non-root user
        run: |
          docker run --rm adcp:ci adcp --version
          docker run --rm adcp:ci python -m adcp --version
          test "$(docker run --rm adcp:ci id -u)" = "10001"

  lockfile:
    name: Lockfile is in sync with pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify uv.lock
        run: uv lock --check
